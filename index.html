<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Navi ❤️ Krish</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="dvd-player">

    <div class="dvd-top">
      <div class="brand">NAVI × KRISH</div>
      <div class="power-light"></div>
    </div>

    <div class="screen">
      <div id="welcomeScreen">
        <div class="dvd-logo">DVD</div>
        <h1>Our Story ❤️</h1>
        <p>Insert our disc to begin</p>
      </div>

      <video id="videoPlayer" controls playsinline></video>

      <div id="menuScreen">
        <h2>LET'S HAVE A LOOK AT OUR RELATIONSHIP ❤️</h2>
        <div id="videoList"></div>
      </div>
    </div>

    <div class="disc-area">
      <div id="disc" class="disc" draggable="true">
        <div class="disc-label">
          <span>NAVI</span>
          <b>❤️</b>
          <span>KRISH</span>
        </div>
        <div class="disc-hole"></div>
      </div>

      <div id="slot" class="slot">
        INSERT DISC
      </div>
    </div>

    <div class="controls">
      <button id="prevBtn">⏮</button>
      <button id="playBtn">▶</button>
      <button id="nextBtn">⏭</button>
      <button id="ejectBtn">⏏</button>
    </div>

    <div id="display">NO DISC</div>

  </div>

  <script src="script.js"></script>

</body>
</html>
