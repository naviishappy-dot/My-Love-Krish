<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>For Krish ❤️</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- =========================
       PAGE 1
  ========================== -->

  <section id="page1" class="page active">

    <div class="heart">♡</div>

    <h1>Hii Krish</h1>

    <p>I love you</p>

    <button
      id="relationshipBtn"
      type="button"
      onclick="
        document.getElementById('page1').classList.remove('active');
        document.getElementById('page2').classList.add('active');
      "
    >
      Let's have a look on our relationship
    </button>

  </section>


  <!-- =========================
       PAGE 2
  ========================== -->

  <section id="page2" class="page">

    <div class="photo-placeholder">

      <img
        src="couple.jpg"
        alt="Our picture"
      >

    </div>


    <button
      id="welcomeBtn"
      type="button"
      onclick="
        document.getElementById('page2').classList.remove('active');
        document.getElementById('page3').classList.add('active');
      "
    >
      Welcome my love
    </button>

  </section>


  <!-- =========================
       PAGE 3
  ========================== -->

  <section id="page3" class="page">

    <h2>Our Little Memories 💿</h2>

    <p>Drag a DVD into the player</p>


    <!-- =========================
         DVD PLAYER
    ========================== -->

    <div class="dvd-player">


      <!-- PLAYER TOP -->

      <div class="player-top">

        <div class="player-brand">
          Navi ❤️ Krish
        </div>

        <div
          id="playerLight"
          class="player-light">
        </div>

      </div>


      <!-- =========================
           SCREEN
      ========================== -->

      <div class="dvd-screen">

        <div id="dvdWelcome">

          <div class="dvd-text">
            DVD
          </div>

          <p>
            Please insert a disc
          </p>

        </div>


        <video
          id="videoPlayer"
          controls
          playsinline>
        </video>

      </div>


      <!-- =========================
           CONTROLS
      ========================== -->

      <div class="player-controls">

        <button
          id="prevBtn"
          type="button">
          ⏮
        </button>

        <button
          id="playBtn"
          type="button">
          ▶
        </button>

        <button
          id="nextBtn"
          type="button">
          ⏭
        </button>

        <button
          id="ejectBtn"
          type="button">
          ⏏
        </button>

      </div>


      <!-- =========================
           DISC TRAY
      ========================== -->

      <div
        class="disc-tray"
        id="discTray">

        <div class="tray-door"></div>

        <div class="tray-inside">

          <div class="disc-slot"></div>

          <div
            id="discInPlayer"
            class="disc-in-player">
          </div>

        </div>

      </div>

    </div>


    <!-- =========================
         DVDS
    ========================== -->

    <div class="discs">


      <!-- DVD 1 -->

      <div
        class="dvd"
        data-video="0"
        draggable="true">

        <div class="dvd-label">
          Our<br>
          Story
        </div>

        <div class="dvd-hole"></div>

      </div>


      <!-- DVD 2 -->

      <div
        class="dvd"
        data-video="1"
        draggable="true">

        <div class="dvd-label">
          Memory<br>
          02
        </div>

        <div class="dvd-hole"></div>

      </div>


      <!-- DVD 3 -->

      <div
        class="dvd"
        data-video="2"
        draggable="true">

        <div class="dvd-label">
          Memory<br>
          03
        </div>

        <div class="dvd-hole"></div>

      </div>


      <!-- DVD 4 -->

      <div
        class="dvd"
        data-video="3"
        draggable="true">

        <div class="dvd-label">
          Memory<br>
          04
        </div>

        <div class="dvd-hole"></div>

      </div>

    </div>

  </section>


  <!-- =========================
       JAVASCRIPT
  ========================== -->

  <script src="script.js"></script>

</body>

</html>
