<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>For Krish ❤️</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- PAGE 1 -->
  <section id="page1" class="page active">

    <div class="heart">♡</div>

    <h1>Hii Krish</h1>

    <p>I love you</p>

    <button id="relationshipBtn">
      Let's have a look on our relationship
    </button>

  </section>


  <!-- PAGE 2 -->
  <section id="page2" class="page">

    <div class="photo-placeholder">
      Our picture will be here ❤️
    </div>

    <button id="welcomeBtn">
      Welcome my love
    </button>

  </section>


  <!-- PAGE 3 -->
  <section id="page3" class="page">

    <h2>Our Little Memories 💿</h2>

    <p>Drag a DVD into the player</p>


    <!-- WOODEN DVD PLAYER -->

    <div class="dvd-player">

      <div class="player-top">

        <div class="player-brand">
          Navi ❤️ Krish
        </div>

        <div id="playerLight" class="player-light"></div>

      </div>


      <!-- SCREEN -->

      <div class="dvd-screen">

        <div id="dvdWelcome">

          <div class="dvd-text">
            DVD
          </div>

          <p>
            Please insert a disc
          </p>

        </div>

        <video
          id="videoPlayer"
          controls
          playsinline>
        </video>

      </div>


      <!-- CONTROLS -->

      <div class="player-controls">

        <button id="prevBtn">
          ⏮
        </button>

        <button id="playBtn">
          ▶
        </button>

        <button id="nextBtn">
          ⏭
        </button>

        <button id="ejectBtn">
          ⏏
        </button>

      </div>


      <!-- DISC TRAY -->

      <div class="disc-tray">

        <div class="disc-slot"></div>

        <div
          id="discInPlayer"
          class="disc-in-player">
        </div>

      </div>

    </div>


    <!-- DVDS -->

    <div class="discs">

      <div
        class="dvd"
        data-video="0"
        draggable="true">

        <div class="dvd-label">
          Our<br>Story
        </div>

        <div class="dvd-hole"></div>

      </div>


      <div
        class="dvd"
        data-video="1"
        draggable="true">

        <div class="dvd-label">
          Memory<br>02
        </div>

        <div class="dvd-hole"></div>

      </div>


      <div
        class="dvd"
        data-video="2"
        draggable="true">

        <div class="dvd-label">
          Memory<br>03
        </div>

        <div class="dvd-hole"></div>

      </div>


      <div
        class="dvd"
        data-video="3"
        draggable="true">

        <div class="dvd-label">
          Memory<br>04
        </div>

        <div class="dvd-hole"></div>

      </div>

    </div>

  </section>


  <script src="script.js"></script>

</body>
</html>
